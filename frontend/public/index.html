<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b65f6" />
  <meta name="description" content="WilsonPlus - Manage Inventory Now!" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <title>WilsonPlus - Manage Inventory Now!</title>

  <!-- Prevent zoom on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Security headers -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;">

  <style>
    /* Loading screen styles */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1b65f6, #4a8af7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
    }

    #loading-screen .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    #loading-screen h2 {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #loading-screen p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Hide loading screen when React app loads */
    .app-loaded #loading-screen {
      display: none;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <h2>WilsonPlus</h2>
    <p>Manage Your Business...</p>
  </div>

  <!-- React root -->
  <div id="root"></div>

  <script>
    // Hide loading screen when React loads
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.body.classList.add('app-loaded');
      }, 1000);
    });
  </script>
</body>

</html>
